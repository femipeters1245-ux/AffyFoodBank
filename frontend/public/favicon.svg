<svg viewBox="0 0 150 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="affyFaviconGrad" x1="0%" y1="100%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="16%" stop-color="#FACC15" />
      <stop offset="35%" stop-color="#4ADE80" />
      <stop offset="55%" stop-color="#00D2D3" />
      <stop offset="78%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FF1378" />
    </linearGradient>
    <filter id="affyFaviconShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="affyFaviconBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- 3D Bag in Deep Purple -->
  <polygon points="14,24 28,18 28,108 14,103" fill="#1E0A3C" />
  <polygon points="28,20 132,16 132,112 28,108" fill="#25104E" />
  <path d="M 64,36 C 64,54 94,54 94,36" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- The 3D Ribbon A -->
  <g filter="url(#affyFaviconShadow)">
    <path d="M 52,94 L 95,24 C 99,17 109,17 113,24 L 126,86" stroke="url(#affyFaviconGrad)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 52,94 L 95,24 C 99,17 109,17 113,24 L 126,86" stroke="url(#affyFaviconBevel)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65" />
  </g>
</svg>
